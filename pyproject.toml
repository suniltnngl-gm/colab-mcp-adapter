[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "colab-mcp-adapter"
version = "0.1.0"
description = "Local stdio MCP adapter for Google Colab CLI — 8 tools: session lifecycle, code/file execution, URL/log"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Colab MCP Adapter Contributors"}
]
keywords = [
    "mcp",
    "colab",
    "google-colab",
    "jupyter",
    "notebook",
    "openai",
    "opencode"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "fastmcp>=2.0,<3",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=4.0",
]

[project.scripts]
colab-mcp-adapter = "colab_mcp_adapter.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/colab_mcp_adapter"]

[tool.hatch.build.targets.sdist]
include = [
    "/.python-version",
    "/LICENSE",
    "/PHASE-*-VERIFICATION.md",
    "/README.md",
    "/RELEASE-MANIFEST.md",
    "/RELEASE-READINESS.md",
    "/USAGE-PLAN.md",
    "/pyproject.toml",
    "/src",
    "/tests",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "S106"]
[tool.ruff.lint]
fixable = ["ALL"]
unfixable = ["T20"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict = true

[tool.coverage.run]
source = ["src/colab_mcp_adapter"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
]
